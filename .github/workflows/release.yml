name: Windows installer

# Builds the Windows installer (NSIS .exe). Run it by hand from the Actions tab,
# or push a tag such as v0.3.0 to also attach the installer to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned build (no code-signing certificate)
      - uses: actions/upload-artifact@v4
        with:
          name: threadkeeper-windows-installer
          path: release/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
